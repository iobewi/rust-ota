[package]
name = "iobewi-firmware-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable firmware artifact streaming and update transaction engine"

[dependencies]
iobewi-firmware-image = { path = "../image", features = ["alloc"] }
iobewi-firmware-auth = { path = "../auth" }
sha2 = { version = "0.10", default-features = false }

[features]
default = []
runtime = ["dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures"]
config-space = ["dep:iobewi-config-space"]
nor-flash = ["dep:embedded-storage"]

[dependencies.embedded-storage]
version = "0.3.1"
optional = true

[dependencies.embassy-sync]
version = "0.8.0"
optional = true

[dependencies.embassy-time]
version = "0.5.0"
optional = true

[dependencies.embassy-futures]
version = "0.1"
optional = true

[dev-dependencies]
iobewi-firmware-auth = { path = "../auth", features = ["verify-p256", "host-sign"] }
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }

[dependencies.iobewi-config-space]
git = "https://github.com/iobewi/rust-mcu-libs"
rev = "59f3b83985caf5b1f617da00dd3dfaa6bd988f28"
optional = true
