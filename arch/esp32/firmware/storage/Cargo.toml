[package]
name = "iobewi-esp-firmware-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP NOR artifact storage adapter shared by firmware domains"

[features]
default = []
esp32c3 = ["iobewi-esp-partitions/esp32c3", "dep:iobewi-esp-flash", "iobewi-esp-flash/esp32c3"]
esp32s3 = ["iobewi-esp-partitions/esp32s3", "dep:iobewi-esp-flash", "iobewi-esp-flash/esp32s3"]

[dependencies]
iobewi-firmware-layout = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "59f3b83985caf5b1f617da00dd3dfaa6bd988f28" }
iobewi-firmware-boot = { path = "../../../../common/firmware/boot" }
iobewi-firmware-update = { path = "../../../../common/firmware/update", features = ["nor-flash"] }
iobewi-esp-partitions = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "59f3b83985caf5b1f617da00dd3dfaa6bd988f28", default-features = false }
embedded-storage = "0.3.1"

[dependencies.iobewi-esp-flash]
git = "https://github.com/iobewi/rust-mcu-libs"
rev = "59f3b83985caf5b1f617da00dd3dfaa6bd988f28"
optional = true
