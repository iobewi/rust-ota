[workspace]
members = [
  "examples/firmware/ota-supervised/component",
  "examples/firmware/ota-supervised",
  "common/firmware/component/abi",
  "common/firmware/component/image",
  "common/firmware/component/native",
  "common/firmware/component/sdk",
  "tools/component-pack",
  "examples/firmware/ota-system",
  "arch/esp32/firmware/boot",
  "examples/firmware/bootloader",
  "arch/esp32/firmware/a",
  "arch/esp32/firmware/supervisor",
  "arch/esp32/firmware/storage",
  "common/firmware/update",
  "common/firmware/boot",
  "common/firmware/image",
  "common/firmware/auth",
  "common/firmware/bootauth",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/iobewi/rust-ota"

# Bootloader must fit before the partition table, with historical size settings.
[profile.bootloader]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
debug = 2
overflow-checks = false

# Signature verification runs once per OTA: favour flash over speed for the
# RustCrypto curve stack (only linked by the signed profile, see
# docs/firmware/ota-image-authentication.md).
[profile.release.package.p256]
opt-level = "s"
[profile.release.package.primeorder]
opt-level = "s"
[profile.release.package.elliptic-curve]
opt-level = "s"
[profile.release.package.ecdsa]
opt-level = "s"
[profile.release.package.crypto-bigint]
opt-level = "s"
[profile.release.package.ff]
opt-level = "s"
[profile.release.package.group]
opt-level = "s"
[profile.release.package.rfc6979]
opt-level = "s"

# Host tests generate 3072-bit RSA keys (iobewi-firmware-bootauth, `host-sign`): unoptimized
# big-integer code takes minutes. Host-only; no firmware profile is affected.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
